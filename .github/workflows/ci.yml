name: PostCard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postcard-ci:
    name: PostCard CI
    runs-on: ubuntu-latest
    env:
      # $HOME/.cache/postcard-mongodb-binaries on the Ubuntu hosted runner.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/postcard-mongodb-binaries
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-mongodb-7.0.41

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Run backend tests
        run: npm test

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: npm run build

      - name: Build runtime Docker image
        run: docker build --target runtime -t postcard-agent:ci .
